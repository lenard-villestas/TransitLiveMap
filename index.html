<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Calgary Transit — live</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; background: #f7f7f5; }
    #cap { position: absolute; z-index: 1000; top: 8px; left: 50px;
           background: #fff; padding: 4px 8px; border-radius: 6px;
           font: 13px system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
    .veh-icon img { width: 28px; height: 28px; display: block;
                    transition: transform .25s linear;   /* smooth turning */
                    filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
    /* tracked bus: pulse the wrapper (scale) so the img's inline rotation is
       left untouched; glow the img. */
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.4); } }
    .veh-icon.tracked { animation: pulse 1s ease-in-out infinite; }
    .veh-icon.tracked img { filter: drop-shadow(0 0 5px #f59e0b) drop-shadow(0 0 10px #f59e0b); }

    /* live ETA bubble floating above the tracked bus */
    .eta-bubble { background: #f59e0b; color: #1f2937; border: none;
                  font: 700 12px system-ui, sans-serif; border-radius: 10px;
                  padding: 2px 8px; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
    .eta-bubble.leaflet-tooltip-top::before { border-top-color: #f59e0b; }

    /* stop-arrival popup */
    .eta-list  { font: 13px system-ui, sans-serif; min-width: 190px; }
    .eta-title { font-weight: 700; margin-bottom: 5px; }
    .eta-empty { color: #64748b; }
    .eta-row   { display: flex; align-items: center; gap: 6px; padding: 3px 0;
                 border-top: 1px solid #eee; }
    .eta-row:first-of-type { border-top: none; }
    .eta-soon  { background: #fff7ed; margin: 0 -5px; padding: 5px; border-radius: 5px; }
    .eta-badge { display: inline-block; min-width: 20px; text-align: center;
                 color: #fff; border-radius: 4px; padding: 1px 5px; font-weight: 700; }
    .eta-head  { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 90px; }
    .eta-min   { margin-left: auto; white-space: nowrap; color: #475569; font-weight: 600; }
    .eta-track { border: 1px solid #cbd5e1; background: #fff; border-radius: 5px;
                 cursor: pointer; font-size: 12px; padding: 1px 7px; }
    .eta-track:hover:not(:disabled) { background: #f1f5f9; }
    .eta-track:disabled { opacity: .45; cursor: not-allowed; }

    /* "stop tracking" bar */
    #trackbar { position: absolute; z-index: 1000; bottom: 14px; left: 50%;
                transform: translateX(-50%); background: #1f2937; color: #fff;
                padding: 6px 12px; border-radius: 20px; display: none;
                font: 13px system-ui, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
    #trackbar button { margin-left: 8px; border: none; background: #f59e0b;
                       color: #1f2937; font-weight: 700; border-radius: 12px;
                       padding: 2px 10px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="cap">loading…</div>
  <div id="trackbar">tracking <span id="trackinfo"></span><button onclick="untrack()">stop</button></div>
  <script>
    const API = location.origin;
    const REFRESH_MS = 15000;
    const STOP_ZOOM = 14;   // below this, don't render bus-stop pins (perf cliff)

    // bus-stop.png is a downward map-pin → anchor at the bottom tip.
    const stopIcon = L.icon({ iconUrl: '/static/bus-stop.png', iconSize: [30, 38],
                              iconAnchor: [15, 38], popupAnchor: [0, -34] });

    let ALL_STOPS = [];                 // [[lat,lon,name,stop_id], ...] from /api/network
    const stopPins = new Map();         // stop_id -> L.marker currently shown
    const vehByTrip = {};               // trip_id -> vehicle id (rebuilt each refresh)
    let tracked = null;                 // { id, tripId, stopId, arrivalEpoch, route }
    let etaCtx = { stopId: null, arrivals: [] };  // arrivals in the open popup
    let etaTimer = null;                // 1s bubble countdown updater
    let lastPan = null;                 // last latlng we follow-panned to

    // Each icon image has a "forward" direction baked in. To point it along a
    // travel bearing B (0=N, clockwise), we rotate by (B - forward).
    const ICONS = {
      bus:   { url: '/static/bus.png',   forward: 90  },  // head points east
      train: { url: '/static/train.png', forward: 135 },  // head points south-east
    };
    function kindFor(type) {
      return /tram|lrt|rail|subway/i.test(type) ? 'train' : 'bus';
    }
    function makeIcon(kind) {
      return L.divIcon({
        html: '<div class="veh-icon"><img src="' + ICONS[kind].url + '"></div>',
        className: '', iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -14]
      });
    }

    // --- minimal basemap ----------------------------------------------------
    const map = L.map('map').setView([51.05, -114.07], 11);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, subdomains: 'abcd', attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    const shapeLayer = L.layerGroup().addTo(map);
    const stopLayer = L.layerGroup();             // off by default (toggle in control)
    const stopRenderer = L.canvas({ padding: 0.5 });
    L.control.layers(null, { 'Route shapes': shapeLayer, 'Stops': stopLayer }).addTo(map);

    async function loadNetwork() {
      const net = await (await fetch(API + '/api/network')).json();
      net.shapes.forEach(s =>
        L.polyline(s.coords, { color: s.color, weight: 1.5, opacity: 0.3 }).addTo(shapeLayer));
      ALL_STOPS = net.stops;            // keep for zoom-gated interactive pins
      net.stops.forEach(s =>
        L.circleMarker([s[0], s[1]], { renderer: stopRenderer, radius: 2,
          color: '#64748b', weight: 0, fillOpacity: 0.7 }).bindPopup(s[2]).addTo(stopLayer));
      renderStopPins();
    }

    // --- zoom-gated stop pins (bus-stop.png) --------------------------------
    // Rendering all ~3000 stops as DOM image markers is a known perf cliff, so
    // only show pins at zoom >= STOP_ZOOM and only for stops inside the viewport.
    function renderStopPins() {
      if (map.getZoom() < STOP_ZOOM) {
        stopPins.forEach(m => map.removeLayer(m));
        stopPins.clear();
        return;
      }
      const b = map.getBounds();
      const want = new Set();
      for (const s of ALL_STOPS) {
        const lat = s[0], lon = s[1], name = s[2], sid = s[3];
        if (!b.contains([lat, lon])) continue;
        want.add(sid);
        if (!stopPins.has(sid)) {
          const m = L.marker([lat, lon], { icon: stopIcon, title: name })
            .on('click', () => openStopEta(sid, name, m)).addTo(map);
          stopPins.set(sid, m);
        }
      }
      for (const sid of [...stopPins.keys()]) {
        if (!want.has(sid)) { map.removeLayer(stopPins.get(sid)); stopPins.delete(sid); }
      }
    }
    // Debounce so follow-cam panning (many moveend/frame) doesn't re-scan 3000 stops each tick.
    let stopPinTimer = null;
    function scheduleStopPins() {
      if (stopPinTimer) return;
      stopPinTimer = setTimeout(() => { stopPinTimer = null; renderStopPins(); }, 150);
    }
    map.on('moveend zoomend', scheduleStopPins);

    // --- stop ETA popup -----------------------------------------------------
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
      c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function etaText(secs) {
      if (secs <= 30) return 'due';
      return Math.round(secs / 60) + ' min';
    }

    async function openStopEta(sid, name, marker) {
      marker.bindPopup('<div class="eta-list eta-empty">loading…</div>').openPopup();
      try {
        const data = await (await fetch(API + '/api/stop/' + encodeURIComponent(sid) + '/eta')).json();
        marker.setPopupContent(renderEtaPopup(name, data));
      } catch (e) {
        marker.setPopupContent('<div class="eta-list eta-empty">ETA unavailable</div>');
      }
    }

    function renderEtaPopup(name, data) {
      etaCtx = { stopId: data.stop_id, arrivals: data.arrivals || [] };
      const head = '<div class="eta-title">' + esc(name) + '</div>';
      if (!etaCtx.arrivals.length)
        return '<div class="eta-list">' + head + '<div class="eta-empty">No upcoming arrivals.</div></div>';
      const rows = etaCtx.arrivals.map((a, i) => {
        const live = vehByTrip[a.trip_id];   // is the serving bus reporting live?
        const btn = '<button class="eta-track" onclick="trackIdx(' + i + ')"' +
          (live ? '' : ' disabled title="vehicle not live yet"') + '>track</button>';
        return '<div class="eta-row' + (i === 0 ? ' eta-soon' : '') + '">' +
          '<span class="eta-badge" style="background:' + esc(a.color) + '">' + esc(a.route) + '</span>' +
          '<span class="eta-head" title="' + esc(a.headsign) + '">' + esc(a.headsign) + '</span>' +
          '<span class="eta-min">' + etaText(a.eta_seconds) + '</span>' + btn + '</div>';
      }).join('');
      return '<div class="eta-list">' + head + rows + '</div>';
    }
    window.trackIdx = function (i) {
      const a = etaCtx.arrivals[i];
      if (a) track(a, etaCtx.stopId);
    };

    // --- bearing from two points (planar approx is fine for short hops) ------
    function bearingDeg(lat1, lon1, lat2, lon2) {
      const dy = lat2 - lat1;
      const dx = (lon2 - lon1) * Math.cos((lat1 + lat2) / 2 * Math.PI / 180);
      return (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;   // 0=N, clockwise
    }

    // --- animation engine ---------------------------------------------------
    const veh = {};
    const lerp = (a, b, t) => a + (b - a) * t;

    function setRotation(v) {
      const el = v.marker.getElement();
      if (!el) return;
      const img = el.querySelector('img');
      if (img) img.style.transform = 'rotate(' + (v.bearing - v.forward) + 'deg)';
    }

    function animate() {
      const now = performance.now();
      for (const id in veh) {
        const v = veh[id];
        if (v.settled) continue;
        const t = v.dur ? Math.min((now - v.startT) / v.dur, 1) : 1;
        v.marker.setLatLng([lerp(v.fromLat, v.toLat, t), lerp(v.fromLon, v.toLon, t)]);
        if (t >= 1) v.settled = true;
      }
      // follow-cam: keep the tracked bus centred as it glides
      if (tracked && veh[tracked.id]) {
        const ll = veh[tracked.id].marker.getLatLng();
        if (!lastPan || lastPan.lat !== ll.lat || lastPan.lng !== ll.lng) {
          map.panTo(ll, { animate: false, noMoveStart: true });
          lastPan = ll;
        }
      }
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    async function refresh() {
      try {
        const data = await (await fetch(API + '/api/vehicles')).json();
        const seen = new Set();
        const now = performance.now();
        for (const k in vehByTrip) delete vehByTrip[k];   // rebuilt below

        data.vehicles.forEach(arr => {
          const [lat, lon, short, color, head, id, type, tripId] = arr;
          seen.add(id);
          if (tripId) vehByTrip[tripId] = id;
          const kind = kindFor(type);
          let v = veh[id];

          if (!v) {
            const marker = L.marker([lat, lon], { icon: makeIcon(kind) })
              .bindPopup('<b>Route ' + short + '</b> (' + type + ')<br>' +
                         (head ? 'to ' + head + '<br>' : '') + 'vehicle ' + id)
              .addTo(map);
            veh[id] = { marker, forward: ICONS[kind].forward, bearing: ICONS[kind].forward,
                        fromLat: lat, fromLon: lon, toLat: lat, toLon: lon,
                        startT: now, dur: REFRESH_MS, settled: true };
          } else if (lat !== v.toLat || lon !== v.toLon) {
            const cur = v.marker.getLatLng();
            v.bearing = bearingDeg(cur.lat, cur.lng, lat, lon);  // face travel direction
            setRotation(v);
            v.fromLat = cur.lat; v.fromLon = cur.lng;
            v.toLat = lat; v.toLon = lon;
            // Glide over the real gap since this vehicle last moved, but never so
            // briefly that it freezes long before the next update arrives.
            v.dur = v.lastMove ? Math.min(Math.max(now - v.lastMove, 12000), 40000) : REFRESH_MS;
            v.startT = now; v.lastMove = now; v.settled = false;
          }
        });

        for (const id in veh) {
          if (!seen.has(id)) {
            if (tracked && tracked.id === id) untrack();   // tracked bus left the feed
            map.removeLayer(veh[id].marker); delete veh[id];
          }
        }

        if (tracked) refreshTrackedEta();   // keep the countdown honest

        document.getElementById('cap').textContent =
          data.vehicles.length + ' vehicles · snapshot ' + data.age +
          's old · refreshed ' + new Date().toLocaleTimeString();
      } catch (e) {
        document.getElementById('cap').textContent = 'fetch error: ' + e;
      }
    }

    // --- tracking: follow + flash + live ETA bubble -------------------------
    function bubbleText(epoch) {
      const secs = epoch - Date.now() / 1000;
      if (secs <= -60) return 'departed';
      if (secs <= 30) return 'due';
      return Math.round(secs / 60) + ' min';
    }

    function wrapperOf(id) {
      const el = veh[id] && veh[id].marker.getElement();
      return el ? el.querySelector('.veh-icon') : null;
    }

    function track(a, stopId) {
      untrack();                              // clear any previous target
      const id = vehByTrip[a.trip_id];
      if (!id || !veh[id]) return;            // bus not reporting live → can't follow
      tracked = { id, tripId: a.trip_id, stopId, arrivalEpoch: a.arrival, route: a.route };
      lastPan = null;
      const w = wrapperOf(id);
      if (w) w.classList.add('tracked');
      veh[id].marker.bindTooltip(bubbleText(a.arrival),
        { permanent: true, direction: 'top', offset: [0, -18], className: 'eta-bubble' }).openTooltip();
      map.closePopup();
      etaTimer = setInterval(updateBubble, 1000);
      updateTrackBar();
    }

    function untrack() {
      if (etaTimer) { clearInterval(etaTimer); etaTimer = null; }
      if (tracked && veh[tracked.id]) {
        veh[tracked.id].marker.unbindTooltip();
        const w = wrapperOf(tracked.id);
        if (w) w.classList.remove('tracked');
      }
      tracked = null;
      updateTrackBar();
    }
    window.untrack = untrack;

    function updateBubble() {
      if (!tracked || !veh[tracked.id]) { untrack(); return; }
      // re-assert the flash class — the marker's DOM is recreated on zoom and
      // doesn't exist until follow-cam pans an off-screen bus into view.
      const w = wrapperOf(tracked.id);
      if (w && !w.classList.contains('tracked')) w.classList.add('tracked');
      const txt = bubbleText(tracked.arrivalEpoch);
      veh[tracked.id].marker.setTooltipContent(txt);
      updateTrackBar();
      if (txt === 'departed') setTimeout(untrack, 1500);
    }

    async function refreshTrackedEta() {
      try {
        const data = await (await fetch(API + '/api/stop/' +
          encodeURIComponent(tracked.stopId) + '/eta')).json();
        const a = (data.arrivals || []).find(x => x.trip_id === tracked.tripId);
        if (a) tracked.arrivalEpoch = a.arrival;          // fresh prediction
        else if (veh[tracked.id]) {                       // bus passed this stop
          veh[tracked.id].marker.setTooltipContent('departed');
          setTimeout(untrack, 1500);
        }
      } catch (e) { /* keep last known ETA on a transient error */ }
    }

    function updateTrackBar() {
      const bar = document.getElementById('trackbar');
      if (!tracked) { bar.style.display = 'none'; return; }
      document.getElementById('trackinfo').textContent =
        'Route ' + tracked.route + ' · ' + bubbleText(tracked.arrivalEpoch);
      bar.style.display = 'block';
    }

    map.on('dragstart', untrack);   // user takes the wheel → stop following

    loadNetwork();
    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
